<!--
  予約ページ用 ヘッダー（カプセル＆サウナ 川崎ビッグ）
  - 折り返し禁止。ロゴの右横にナビ → その直後に TEL + 予約ボタン（お問合せのすぐ右）
  - 1300px 未満はナビ/アクションを隠し、ハンバーガー + 全画面メニューを表示（HPと同挙動）
  - 全 CSS/JS を同梱。クラス名は kb- プレフィックスで衝突回避
-->
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  .kb-header * { box-sizing: border-box; }
  .kb-header {
    position: relative; width: 100%; background: #ffffff;
    border-bottom: 1px solid #e6e6e6;
    font-family: 'Zen Kaku Gothic New','Noto Sans JP', sans-serif;
    color: #2c2c2c; z-index: 50;
  }
  .kb-header__inner {
    max-width: 1400px; margin: 0 auto; padding: 14px 24px;
    display: flex; align-items: center; gap: 16px;
    flex-wrap: nowrap; white-space: nowrap;
  }
  .kb-header__logo { display: inline-flex; align-items: center; text-decoration: none; flex-shrink: 0; }
  .kb-header__logo img { height: 56px; width: auto; display: block; }

  /* ナビ：ロゴの右横に密着 */
  .kb-header__nav {
    display: flex; align-items: center; gap: 18px;
    list-style: none; padding: 0; margin: 0 0 0 24px;
    flex-wrap: nowrap; min-width: 0;
  }
  .kb-header__nav a {
    color: #2c4a6e; font-weight: 500; font-size: 13px;
    text-decoration: none; white-space: nowrap; letter-spacing: .04em;
    transition: color .2s;
  }
  .kb-header__nav a:hover { color: #3da657; }
  .kb-header__nav a.kb-now { color: #3da657; border-bottom: 2px solid #3da657; padding-bottom: 4px; }

  /* アクション：お問合せのすぐ右（margin-left:auto は付けない） */
  .kb-header__actions {
    display: flex; align-items: center; gap: 14px;
    flex-shrink: 0; margin-left: 8px;
  }
  .kb-header__tel { text-decoration: none; color: #2c4a6e; line-height: 1.1; text-align: right; }
  .kb-header__tel-label { display: block; font-size: 10px; letter-spacing: .12em; color: #888; }
  .kb-header__tel-num { display: block; font-size: 18px; font-weight: 700; }
  .kb-header__cta {
    display: inline-block; background: #3da657; color: #ffffff !important;
    text-decoration: none; font-weight: 700; padding: 12px 22px;
    border-radius: 999px; font-size: 14px; letter-spacing: .04em;
    transition: background .2s, transform .2s; flex-shrink: 0;
  }
  .kb-header__cta:hover { background: #2f8a47; transform: translateY(-1px); }

  /* ハンバーガー（PCでは非表示） */
  .kb-hamburger {
    display: none; flex-direction: column; justify-content: center; gap: 5px;
    width: 44px; height: 44px; margin-left: auto; padding: 10px;
    background: none; border: none; cursor: pointer; flex-shrink: 0;
  }
  .kb-hamburger span { display: block; width: 24px; height: 2px; background: #2c4a6e; transition: transform .3s, opacity .3s; }
  .kb-hamburger.is-active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .kb-hamburger.is-active span:nth-child(2) { opacity: 0; }
  .kb-hamburger.is-active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  /* 全画面モバイルメニュー */
  .kb-mobile-menu {
    display: none; position: fixed; inset: 0; z-index: 9999;
    background: rgba(255,255,255,.98);
    flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; overflow-y: auto;
    font-family: 'Zen Kaku Gothic New','Noto Sans JP', sans-serif;
  }
  .kb-mobile-menu.is-open { display: flex; }
  .kb-mobile-menu__close {
    position: absolute; top: 18px; right: 20px;
    width: 40px; height: 40px; border: none; background: none; cursor: pointer;
    font-size: 30px; line-height: 1; color: #2c4a6e;
  }
  .kb-mobile-menu__list { list-style: none; padding: 0; margin: 0 0 32px; text-align: center; }
  .kb-mobile-menu__list li { margin-bottom: 18px; }
  .kb-mobile-menu__list a {
    color: #2c2c2c; text-decoration: none; font-size: 17px; font-weight: 700; letter-spacing: .1em;
  }
  .kb-mobile-menu__list a.kb-now { color: #3da657; }
  .kb-mobile-menu__contact { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; max-width: 320px; }
  .kb-mobile-menu__tel { text-decoration: none; color: #2c4a6e; font-size: 22px; font-weight: 700; }
  .kb-mobile-menu__cta {
    display: inline-block; width: 100%; text-align: center;
    background: #3da657; color: #fff !important; text-decoration: none; font-weight: 700;
    padding: 14px 24px; border-radius: 999px; font-size: 16px;
  }

  /* ===== ブレークポイント ===== */
  @media (max-width: 1299px) {
    .kb-header__nav, .kb-header__actions { display: none; }
    .kb-hamburger { display: flex; }
  }
  @media (max-width: 768px) {
    .kb-header__inner { padding: 12px 16px; }
    .kb-header__logo img { height: 40px; }
  }
</style>

<script>
(function () {
  var btn   = document.querySelector('.kb-hamburger');
  var menu  = document.getElementById('kb-mobile-menu');
  var close = menu ? menu.querySelector('.kb-mobile-menu__close') : null;
  if (!btn || !menu) return;
  function setOpen(open) {
    menu.classList.toggle('is-open', open);
    btn.classList.toggle('is-active', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  btn.addEventListener('click', function () { setOpen(!menu.classList.contains('is-open')); });
  if (close) close.addEventListener('click', function () { setOpen(false); });
  menu.addEventListener('click', function (e) {
    if (e.target === menu || e.target.tagName === 'A') setOpen(false);
  });
})();
</script>
