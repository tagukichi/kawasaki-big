<!--
  予約ページ用 ヘッダー（カプセル＆サウナ 川崎ビッグ）
  - 折り返し禁止、ナビはロゴの直後に密着配置
  - TEL/CTA は margin-left: auto で右端に押し出し
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">

<style>
  .kb-header * { box-sizing: border-box; }
  .kb-header {
    position: relative; width: 100%; background: #ffffff;
    border-bottom: 1px solid #e6e6e6;
    font-family: 'Zen Kaku Gothic New','Noto Sans JP', sans-serif;
    color: #2c2c2c; z-index: 50;
  }
  .kb-header__inner {
    max-width: 1400px; margin: 0 auto; padding: 14px 24px;
    display: flex; align-items: center; gap: 16px;
    flex-wrap: nowrap; white-space: nowrap;
  }
  .kb-header__logo { display: inline-flex; align-items: center; text-decoration: none; flex-shrink: 0; }
  .kb-header__logo img { height: 56px; width: auto; display: block; }
  .kb-header__nav {
    display: flex; align-items: center; gap: 18px;
    list-style: none; padding: 0; margin: 0 0 0 24px;   /* ロゴとの距離だけ確保、auto なし */
    flex-wrap: nowrap; min-width: 0; overflow: hidden;
  }
  .kb-header__nav a {
    color: #2c4a6e; font-weight: 500; font-size: 13px;
    text-decoration: none; white-space: nowrap; letter-spacing: .04em;
    transition: color .2s;
  }
  .kb-header__nav a:hover { color: #3da657; }
  .kb-header__nav a.kb-now {
    color: #3da657; border-bottom: 2px solid #3da657; padding-bottom: 4px;
  }
  .kb-header__actions {
    display: flex; align-items: center; gap: 14px;
    flex-shrink: 0; margin-left: auto;                  /* ★actions を右端に */
  }
  .kb-header__tel { text-decoration: none; color: #2c4a6e; line-height: 1.1; text-align: right; }
  .kb-header__tel-label { display: block; font-size: 10px; letter-spacing: .12em; color: #888; }
  .kb-header__tel-num { display: block; font-size: 18px; font-weight: 700; }
  .kb-header__cta {
    display: inline-block; background: #3da657; color: #ffffff !important;
    text-decoration: none; font-weight: 700; padding: 12px 22px;
    border-radius: 999px; font-size: 14px; letter-spacing: .04em;
    transition: background .2s, transform .2s; flex-shrink: 0;
  }
  .kb-header__cta:hover { background: #2f8a47; transform: translateY(-1px); }

  /* 1300px未満はナビ非表示（logo + tel + CTA のみ表示） */
  @media (max-width: 1299px) {
    .kb-header__nav { display: none; }
  }
  @media (max-width: 768px) {
    .kb-header__inner { padding: 12px 16px; gap: 10px; }
    .kb-header__logo img { height: 40px; }
    .kb-header__tel-label { display: none; }
    .kb-header__tel-num { font-size: 14px; }
    .kb-header__cta { padding: 9px 14px; font-size: 12px; }
  }
  @media (max-width: 480px) { .kb-header__tel { display: none; } }
</style>

<header class="kb-header">
  <div class="kb-header__inner">
    <a href="http://kawasaki-big.com/" class="kb-header__logo" aria-label="カプセル＆サウナ 川崎ビッグ">
      <img src="http://kawasaki-big.com/wp-content/uploads/2026/07/title_l.png" alt="カプセル＆サウナ 川崎ビッグ">
    </a>

    <ul class="kb-header__nav">
      <li><a href="http://kawasaki-big.com/">ホーム</a></li>
      <li><a href="https://www5.489pro.com/asp/489/menu.asp?id=14000064&amp;lan=JPN" class="kb-now">ご予約</a></li>
      <li><a href="http://kawasaki-big.com/spa_sauna/">浴室・サウナ</a></li>
      <li><a href="http://kawasaki-big.com/restaurant/">レストラン</a></li>
      <li><a href="http://kawasaki-big.com/hours_prices/">営業時間・料金</a></li>
      <li><a href="http://kawasaki-big.com/bodycare/">ボディケア</a></li>
      <li><a href="http://kawasaki-big.com/floor/">館内案内</a></li>
      <li><a href="http://kawasaki-big.com/access/">アクセス</a></li>
      <li><a href="http://kawasaki-big.com/inquiry/">お問合せ</a></li>
    </ul>

    <div class="kb-header__actions">
      <a href="tel:0442460008" class="kb-header__tel" aria-label="電話番号 044-246-0008">
        <span class="kb-header__tel-label">電話番号</span>
        <span class="kb-header__tel-num">044-246-0008</span>
      </a>
      <a href="https://www5.489pro.com/asp/489/menu.asp?id=14000064&amp;lan=JPN" class="kb-header__cta">ご予約</a>
    </div>
  </div>
</header>
