<style>
  /* ===== Kawasaki Big | 予約ページ フッター ===== */
  .kb-footer * { box-sizing: border-box; }
  .kb-footer {
    width: 100%;
    background: #fffbad;
    color: #2c2c2c;
    font-family: 'Zen Kaku Gothic New','Noto Sans JP', sans-serif;
    margin-top: 40px;
  }
  .kb-footer__inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 56px 24px 32px;
    display: grid;
    grid-template-columns: 1.2fr 1fr 1fr 1.4fr;
    gap: 36px;
    align-items: start;
  }

  /* 左：ブランド */
  .kb-footer__brand-jp {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 22px;
    font-weight: 900;
    margin: 0 0 8px;
    color: #2c4a6e;
    letter-spacing: .04em;
  }
  .kb-footer__brand-lead {
    font-size: 12px;
    color: #555;
    margin: 0 0 16px;
    letter-spacing: .02em;
  }
  .kb-footer__addr {
    font-size: 13px;
    line-height: 1.8;
    font-style: normal;
    color: #2c2c2c;
    margin-bottom: 18px;
  }
  .kb-footer__addr a {
    color: #2c4a6e;
    text-decoration: none;
    font-weight: 700;
  }
  .kb-footer__addr a:hover { text-decoration: underline; }
  .kb-footer__sns {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    gap: 10px;
  }
  .kb-footer__sns a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #ffffff;
    color: #2c4a6e;
    text-decoration: none;
    transition: background .2s, color .2s;
  }
  .kb-footer__sns a:hover { background: #2c4a6e; color: #ffffff; }
  .kb-footer__sns svg { width: 18px; height: 18px; }

  /* 中：列見出し + リンク */
  .kb-footer__col-title {
    font-size: 13px;
    font-weight: 700;
    color: #2c4a6e;
    margin: 0 0 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid #2c4a6e;
    letter-spacing: .08em;
  }
  .kb-footer__links {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .kb-footer__links li { margin-bottom: 8px; }
  .kb-footer__links a {
    color: #2c2c2c;
    text-decoration: none;
    font-size: 13px;
    transition: color .2s;
  }
  .kb-footer__links a:hover { color: #3da657; }

  /* 右：キービジュアル */
  .kb-footer__keyvisual {
    margin: 0;
  }
  .kb-footer__keyvisual img {
    max-width: 100%;
    height: auto;
    display: block;
  }

  /* 下部コピーライト */
  .kb-footer__bottom {
    border-top: 1px solid rgba(0,0,0,.08);
    padding: 16px 24px;
    text-align: center;
  }
  .kb-footer__bottom p {
    font-size: 11px;
    color: #666;
    margin: 0;
    letter-spacing: .04em;
  }

  /* ===== タブレット ===== */
  @media (max-width: 960px) {
    .kb-footer__inner {
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      padding: 40px 20px 24px;
    }
    .kb-footer__keyvisual { grid-column: 1 / -1; }
  }
  /* ===== スマホ ===== */
  @media (max-width: 560px) {
    .kb-footer__inner {
      grid-template-columns: 1fr;
      gap: 24px;
      padding: 32px 16px 20px;
    }
  }
</style>
